<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">EventHub Pro</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="booking.html">Book Event</a></li>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total Bookings</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Upcoming Event</h3>
                <p id="nextEventName">None</p>
                <small id="countdownTimer">--:--:--</small>
            </div>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h2>Manage Bookings</h2>
                <select id="filterEvent">
                    <option value="all">All Categories</option>
                    <option value="Workshop">Workshops</option>
                    <option value="Seminar">Seminars</option>
                    <option value="Concert">Concerts</option>
                </select>
            </div>
            <div id="bookingContainer" class="grid-container">
                </div>
        </section>
    </main>

    <template id="bookingTemplate">
        <div class="booking-card">
            <div class="badge" id="typeBadge"></div>
            <h3 class="event-name"></h3>
            <p><strong>Attendee:</strong> <span class="user-name"></span></p>
            <p><strong>Date:</strong> <span class="event-date"></span></p>
            <button class="delete-btn">Remove</button>
        </div>
    </template>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
