<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Book Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">EventHub Pro</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="booking.html" class="active">Book Event</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="form-section">
            <h2>Secure Your Spot</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" placeholder="+123456789">
                </div>
                <div class="form-group">
                    <label>Event Category</label>
                    <select id="eventType">
                        <option value="">-- Select --</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Seminar">Seminar</option>
                        <option value="Concert">Concert</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Event Date</label>
                    <input type="date" id="eventDate">
                </div>
                <button type="submit" id="submitBtn">Confirm Booking</button>
                <p id="errorMsg"></p>
            </form>
        </section>

        <div id="loadingSection" class="overlay" style="display:none;">
            <div class="loader"></div>
            <p>Processing your reservation...</p>
        </div>
    </main>

    <template id="bookingTemplate">
        <div class="booking-card">
            <h3 class="event-name"></h3>
            <p class="user-name"></p>
            <p class="event-date"></p>
            <button class="delete-btn">Cancel Booking</button>
        </div>
    </template>

    <script   src="script.js"></script>
</body>
</html>
