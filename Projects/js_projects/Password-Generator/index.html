<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Password Generator</title>
</head>

<body>

    <h1>Smart and strong Password Generator</h1>
    <h3>Enter your details</h3>

    <div>

        <label>First Name:</label><br>
        <input type="text" id="firstName" placeholder="Enter first name"><br><br>

        <label>Surname:</label><br>
        <input type="text" id="surname" placeholder="Enter surname"><br><br>

        <label>Date of Birth:</label><br>
        <input type="date" id="dob"><br><br>

        <label>Mobile Number:</label><br>
        <input type="number" id="mobile" placeholder="Enter mobile number"><br><br>

        <button id="generateBtn">Generate Password</button>

    </div>

    <h2 id="result">Your Generated Password Will Appear Here</h2>

    <script src="index.js"></script>
    

</body>

</html>
